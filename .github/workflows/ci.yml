name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow running CI on a feature branch without a PR

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - run: go build ./...
      - run: go vet ./...
      - name: Test (on failure, emit tail as annotations — readable via API)
        shell: bash
        run: |
          if go test -v ./... 2>&1 | tee /tmp/test.log; then
            exit 0
          fi
          tail -c 4000 /tmp/test.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stub the embedded frontend dist
        # A fresh checkout has no frontend/dist (it is a build artefact), and
        # main.go embeds it, so go vet/test need the directory to exist.
        working-directory: gui
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Vet and test
        working-directory: gui
        run: |
          go vet ./...
          go test ./...
      - name: Build
        working-directory: gui
        run: wails build -nocolour

  macos:
    # CLI and GUI share one job on purpose: GitHub's arm64 macOS runners are a
    # small pool and jobs can sit queued until GitHub cancels them (~15 min
    # observed). One runner per run instead of two halves that exposure.
    # macos-14 was cancelled instantly (image unavailable), so stay on 15 and
    # retry when the pool is congested.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: CLI build, vet and test
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Stub the embedded frontend dist
        working-directory: gui
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: GUI vet and test
        working-directory: gui
        run: |
          go vet ./...
          go test ./...
      - name: Bindings are up to date
        working-directory: gui
        shell: bash
        run: |
          # wails writes the generated JS with the exec bit on some runners;
          # only content differences matter.
          git config core.fileMode false
          wails generate module
          git diff --exit-code -- frontend/wailsjs
      - name: GUI build
        working-directory: gui
        run: wails build -nocolour
