name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported targets only: Windows 10/11 amd64, macOS Apple Silicon.
          # Windows GUI needs a Windows runner (WebView2); the CLI still
          # cross-compiles, but is built here to keep one machine per target.
          - os: windows-latest
            target_os: windows
            target_arch: amd64
          - os: macos-15
            target_os: darwin
            target_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run update tests
        # The installer's rename-while-running and rollback behaviour differs
        # per OS, so exercise these on the real runner before packaging.
        shell: bash
        run: go test ./internal/update/ ./cmd/monctl/
      - name: Run GUI tests
        shell: bash
        working-directory: gui
        run: |
          # A fresh checkout has no frontend/dist and main.go embeds it.
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          go test ./...
      - name: Build CLI
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          if [ "$TARGET_OS" = "windows" ]; then
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
              -o dist/monctl-windows-amd64.exe ./cmd/monctl
          else
            GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" \
              -o dist/monctl-darwin-arm64 ./cmd/monctl
          fi
      - name: Set GUI version
        shell: bash
        working-directory: gui
        run: |
          python3 -c "import json,os;p='wails.json';d=json.load(open(p));d.setdefault('info',{})['productVersion']=os.environ['GITHUB_REF_NAME'].lstrip('v');json.dump(d,open(p,'w'),indent=2)"
      - name: Build GUI (Windows)
        if: matrix.target_os == 'windows'
        shell: bash
        working-directory: gui
        run: |
          wails build -nocolour -ldflags "-X main.version=${GITHUB_REF_NAME}" -o monctl-gui-windows-amd64
          # wails uses the -o name verbatim; whether it appends .exe has
          # changed between versions, so accept either.
          src=build/bin/monctl-gui-windows-amd64
          [ -f "$src" ] || src="$src.exe"
          cp "$src" ../dist/monctl-gui-windows-amd64.exe
      - name: Build GUI + dmg (macOS)
        if: matrix.target_os == 'darwin'
        shell: bash
        working-directory: gui
        run: |
          wails build -nocolour -ldflags "-X main.version=${GITHUB_REF_NAME}"
          ../tools/app/mkdmg.sh build/bin ../dist/monctl-macos-arm64.dmg monctl
          # The in-app updater replaces the whole bundle, so publish the app
          # as a zip whose root holds exactly one monctl.app.
          ditto -c -k --keepParent build/bin/monctl.app ../dist/monctl-macos-arm64.zip
          # Fail the release here rather than shipping a zip every updater
          # would reject: root shape, no symlinks, and the plist version.
          python3 - <<'PY'
          import os, plistlib, stat, sys, zipfile
          with zipfile.ZipFile("../dist/monctl-macos-arm64.zip") as z:
              tops = {n.split("/", 1)[0] for n in z.namelist()}
              if tops != {"monctl.app"}:
                  sys.exit("zip root is %r, want exactly monctl.app" % sorted(tops))
              for i in z.infolist():
                  if stat.S_ISLNK(i.external_attr >> 16):
                      sys.exit("zip contains symlink %s" % i.filename)
              with z.open("monctl.app/Contents/Info.plist") as f:
                  data = f.read()
              # Wails writes a bare DOCTYPE without the XML declaration;
              # plistlib refuses that, so add the declaration it expects.
              if not data.lstrip().startswith(b"<?xml"):
                  data = b'<?xml version="1.0" encoding="UTF-8"?>\n' + data
              version = plistlib.loads(data)["CFBundleShortVersionString"]
          want = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if version != want:
              sys.exit("bundle version %s does not match tag %s" % (version, want))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist/
      - name: Generate checksums
        # The CLI updater downloads this file and verifies the asset it picks.
        # List the expected artifacts explicitly so a missing build fails the
        # release instead of producing a self-consistent but incomplete list.
        working-directory: dist
        run: |
          set -eu
          for f in monctl-windows-amd64.exe monctl-gui-windows-amd64.exe \
                   monctl-darwin-arm64 monctl-macos-arm64.dmg monctl-macos-arm64.zip; do
            [ -f "$f" ] || { echo "::error::missing release artifact $f"; exit 1; }
          done
          sha256sum -- monctl-* > SHA256SUMS
          sha256sum --check --quiet SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
