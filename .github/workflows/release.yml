name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported targets only: Windows 10/11 amd64, macOS Apple Silicon.
          # Windows GUI needs a Windows runner (WebView2); the CLI still
          # cross-compiles, but is built here to keep one machine per target.
          - os: windows-latest
            target_os: windows
            target_arch: amd64
          - os: macos-15
            target_os: darwin
            target_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build CLI
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          if [ "$TARGET_OS" = "windows" ]; then
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
              -o dist/monctl-windows-amd64.exe ./cmd/monctl
          else
            GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" \
              -o dist/monctl-darwin-arm64 ./cmd/monctl
          fi
      - name: Set GUI version
        shell: bash
        working-directory: gui
        run: |
          python3 -c "import json,os;p='wails.json';d=json.load(open(p));d.setdefault('info',{})['productVersion']=os.environ['GITHUB_REF_NAME'].lstrip('v');json.dump(d,open(p,'w'),indent=2)"
      - name: Build GUI (Windows)
        if: matrix.target_os == 'windows'
        shell: bash
        working-directory: gui
        run: |
          wails build -nocolour -ldflags "-X main.version=${GITHUB_REF_NAME}" -o monctl-gui-windows-amd64
          # wails uses the -o name verbatim; whether it appends .exe has
          # changed between versions, so accept either.
          src=build/bin/monctl-gui-windows-amd64
          [ -f "$src" ] || src="$src.exe"
          cp "$src" ../dist/monctl-gui-windows-amd64.exe
      - name: Build GUI + dmg (macOS)
        if: matrix.target_os == 'darwin'
        shell: bash
        working-directory: gui
        run: |
          wails build -nocolour -ldflags "-X main.version=${GITHUB_REF_NAME}"
          ../tools/app/mkdmg.sh build/bin ../dist/monctl-macos-arm64.dmg monctl
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
